<script>
var M={VERSION:"1.0.0"};
/* ---- 00_core.js ---- */
/* ===== 00_core.js — Palette, indizierter Framebuffer, Rasterprimitive, Dithering, Farbtabellen, Bitmap-Schrift =====
   Alles, was gezeichnet wird, sind Palettenindizes. Licht und Schatten sind Schritte auf Farbrampen,
   Übergänge entstehen durch geordnetes Bayer-Dithering. Keine Bilddateien. */
var M = (typeof M !== 'undefined') ? M : {};
(function(M){
'use strict';

// ---------------------------------------------------------------- Palette: Adria, Kalkstein, Terrakotta, Dämmerung, Geisterblau

 ['n0','141c36'],['n1','1f2c50'],['n2','2f4274'],['n3','4a6599'],['n4','7d97c4'],['n5','bccde6'],

 ['t0','361812'],['t1','5a2719'],['t2','853d26'],['t3','b05a34'],['t4','d4814d'],['t5','ebab76'],

 ['b0','2a4a77'],['b1','3f6496'],['b2','5a82b4'],['b3','81a5cf'],['b4','afc8e4'],['b5','dce8f4'],

 ['y0','3a2307'],['y1','6a400e'],['y2','a4681b'],['y3','d99a33'],['y4','f3c75c'],['y5','fff0a6'],
 ['r0','2b0b11'],['r1','4e141e'],['r2','79212e'],['r3','a53848'],['r4','cc5f68'],
 ['m0','1f232b'],['m1','363c48'],['m2','565d6b'],['m3','808796'],['m4','b0b6c1'],
 ['p0','3c2018'],['p1','6b3b2b'],['p2','995d44'],['p3','c58967'],['p4','e2b391'],['p5','f4d6bb'],
 ['q0','33201a'],['q1','593929'],['q2','83583f'],['q3','aa7b5a'],['q4','cca07f'],
 ['c0','19212f'],['c1','28374e'],['c2','3a4f6f'],['c3','577092'],['c4','7f96b2'],
 ['e0','28231a'],['e1','443a29'],['e2','63573c'],['e3','877854'],['e4','ad9e72'],
 ['h0','110c0a'],['h1','1f1511'],['h2','312119'],['h3','473024'],
 ['x0','0d202d'],['x1','1a3a4c'],['x2','2c6074'],['x3','4b8f9f'],['x4','82c1c9'],['x5','c3ecee'],['x6','eefbfb'],
 ['v0','1c152d'],['v1','33284f'],['v2','524577'],['v3','7a6fa3'],['v4','afa6d1'],['v5','e0daf2'],

var P = {}, RGB = [];
PAL_DEF.forEach(function(e,i){ P[e[0]]=i; var h=e[1]; RGB.push([parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]); });
var T = 255;
M.P=P; M.RGB=RGB; M.T=T; M.NCOL=PAL_DEF.length; M.PNAME=PAL_DEF.map(function(e){ return e[0]; });

// Rampen (dunkel -> hell). Jede Farbe kennt ihren hellen und dunklen Nachbarn (UP/DN).
var RAMPS = [
 'k0 k1 k2 n0 n1 n2 n3 n4 n5 l1',
 'k0 s0 s1 s2 s3 s4 s5 s6 l1',
 'k0 t0 t1 t2 t3 t4 t5 l0',
 'k0 w0 w1 w2 w3 w4 w5 d6',
 'k0 g0 g1 g2 g3 g4 g5 s5',
 'k0 a0 a1 a2 a3 a4 a5 a6 l1',
 'n1 b0 b1 b2 b3 b4 b5 l1',
 'k1 d0 d1 d2 d3 d4 d5 d6 l0',
 'k0 y0 y1 y2 y3 y4 y5 l1',
 'k0 r0 r1 r2 r3 r4 d5',
 'k0 m0 m1 m2 m3 m4 s6',

 'k0 q0 q1 q2 q3 q4 p5',

 'k0 e0 e1 e2 e3 e4 s5',
 'k0 h0 h1 h2 h3 w2',
 'k0 x0 x1 x2 x3 x4 x5 x6 l1',
 'k0 v0 v1 v2 v3 v4 v5 l1',
 'y5 l0 l1'
];
var UP=new Uint8Array(256), DN=new Uint8Array(256), home={};
for (var i=0;i<256;i++){ UP[i]=i; DN[i]=i; }
RAMPS.forEach(function(r){ var a=r.split(' ').map(function(n){ return P[n]; });
  a.forEach(function(c,j){ if (home[c]) return; home[c]=1; UP[c]=a[Math.min(a.length-1,j+1)]; DN[c]=a[Math.max(0,j-1)]; }); });
UP[T]=T; DN[T]=T;
M.UP=UP; M.DN=DN;
M.step=function(c,n){ while(n>0){ c=UP[c]; n--; } while(n<0){ c=DN[c]; n++; } return c; };
function lum(c){ var q=RGB[c]; return q[0]*0.3+q[1]*0.59+q[2]*0.11; }
M.lum=lum;

// ---------------------------------------------------------------- Dithering, Zufall, Hash
var BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function bayer(x,y){ return (BAYER[(y&3)*4+(x&3)]+0.5)/16; }
M.bayer=bayer;
M.qd=function(v,x,y){ var f=Math.floor(v), t=(v-f-0.5)*3+0.5; if(t<0)t=0; if(t>1)t=1; return f+(t>bayer(x,y)?1:0); };
M.rng=function(seed){ var s=(seed>>>0)||1; return function(){ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; }; };
M.hash=function(x,y){ var s=Math.sin(x*12.9898+y*78.233)*43758.5453; return s-Math.floor(s); };

// ---------------------------------------------------------------- Farbtabellen: "verwandle, dann nimm die nächste Palettenfarbe", mit Dither zwischen zwei Kandidaten
function nearest2(r,g,b){
  var best=0, bd=1e12, sec=0, sd=1e12;
  for (var i=0;i<RGB.length;i++){ var q=RGB[i], dr=q[0]-r, dg=q[1]-g, db=q[2]-b, d=dr*dr*0.3+dg*dg*0.59+db*db*0.11;
    if (d<bd){ sec=best; sd=bd; best=i; bd=d; } else if (d<sd){ sec=i; sd=d; } }
  var a=Math.sqrt(bd), s=Math.sqrt(sd), ratio=(a+s)>0? a/(a+s) : 0; // 0 = genau getroffen
  return [best,sec,ratio];
}
// fn(r,g,b) -> [r,g,b]; Ergebnis: {a,b,r} für M.tintApply
M.tintMake=function(fn){
  var A=new Uint8Array(256), B=new Uint8Array(256), R=new Float32Array(256);
  for (var i=0;i<256;i++){ if (i>=RGB.length){ A[i]=B[i]=i; R[i]=0; continue; }
    var q=RGB[i], o=fn(q[0],q[1],q[2]); var n=nearest2(Math.max(0,Math.min(255,o[0])),Math.max(0,Math.min(255,o[1])),Math.max(0,Math.min(255,o[2])));
    A[i]=n[0]; B[i]=n[1]; R[i]=Math.min(0.5,n[2]); }
  A[T]=T; B[T]=T; return {a:A,b:B,r:R};
};
M.tintPx=function(t,c,x,y){ if (c===T) return T; return (t.r[c]>0.02 && bayer(x,y)<t.r[c]) ? t.b[c] : t.a[c]; };
M.tintApply=function(buf,t,x0,y0,w,h,mask){ x0=x0||0; y0=y0||0; w=w===undefined?buf.w:w; h=h===undefined?buf.h:h;
  for (var y=Math.max(0,y0);y<Math.min(buf.h,y0+h);y++) for (var x=Math.max(0,x0);x<Math.min(buf.w,x0+w);x++){
    if (mask && !mask(x,y)) continue; var k=y*buf.w+x, c=buf.d[k]; if (c===T) continue; buf.d[k]=M.tintPx(t,c,x,y); } };
// einfache Index-Tabelle ohne Dither (für Figuren, schnell)
M.lutOf=function(t){ return t.a; };
var lumOf=function(r,g,b){ return r*0.3+g*0.59+b*0.11; };
M.TINT={
  // Nacht: dunkel, kalt, blau
  night: M.tintMake(function(r,g,b){ var L=lumOf(r,g,b); return [r*0.22+L*0.08, g*0.28+L*0.10, b*0.42+L*0.18+16]; }),
  // Dämmerung: wärmer, violett-orange, etwas dunkler
  dusk: M.tintMake(function(r,g,b){ return [r*0.80+18, g*0.58+4, b*0.66+22]; }),
  // Morgengrauen: kühl-rosa, gedämpft
  dawn: M.tintMake(function(r,g,b){ var L=lumOf(r,g,b); return [r*0.62+L*0.12+14, g*0.60+L*0.10+8, b*0.70+L*0.12+24]; }),
  // Geistersicht: entsättigt, kalt, cyan
  ghost: M.tintMake(function(r,g,b){ var L=lumOf(r,g,b); return [L*0.42+r*0.06, L*0.80+g*0.08+6, L*0.86+b*0.10+14]; }),
  // Erinnerung (Nachhall): Sepia, verblasst
  memory: M.tintMake(function(r,g,b){ var L=lumOf(r,g,b); return [L*0.95+30, L*0.80+18, L*0.58+6]; }),
  // gedimmt (Hintergrund hinter Menüs)
  dim: M.tintMake(function(r,g,b){ return [r*0.45, g*0.45, b*0.5]; }),
  // Geister in Markos Blick: blass-lavendel
  spirit: M.tintMake(function(r,g,b){ var L=lumOf(r,g,b); return [L*0.70+40, L*0.68+40, L*0.80+62]; }),
  // Mala in Markos Blick: kühl, blass
  mala: M.tintMake(function(r,g,b){ var L=lumOf(r,g,b); return [r*0.30+L*0.40+20, g*0.30+L*0.55+30, b*0.30+L*0.62+48]; })
};

// ---------------------------------------------------------------- indizierter Puffer
function Buf(w,h,fill){ this.w=w; this.h=h; this.d=new Uint8Array(w*h); if (fill!==undefined) this.d.fill(fill); }
var B=Buf.prototype;
B.px=function(x,y,c){ x|=0; y|=0; if(x<0||y<0||x>=this.w||y>=this.h||c===undefined||c===T) return; this.d[y*this.w+x]=c; };
B.get=function(x,y){ x|=0; y|=0; if(x<0||y<0||x>=this.w||y>=this.h) return T; return this.d[y*this.w+x]; };
B.rect=function(x,y,w,h,c){ for(var j=Math.max(0,y|0);j<Math.min(this.h,(y|0)+h);j++) for(var i=Math.max(0,x|0);i<Math.min(this.w,(x|0)+w);i++) this.d[j*this.w+i]=c; };
B.hl=function(x0,x1,y,c){ if(x0>x1){var t=x0;x0=x1;x1=t;} for(var i=x0;i<=x1;i++) this.px(i,y,c); };
B.vl=function(x,y0,y1,c){ if(y0>y1){var t=y0;y0=y1;y1=t;} for(var j=y0;j<=y1;j++) this.px(x,j,c); };
B.line=function(x0,y0,x1,y1,c){ x0|=0;y0|=0;x1|=0;y1|=0; var dx=Math.abs(x1-x0),sx=x0<x1?1:-1,dy=-Math.abs(y1-y0),sy=y0<y1?1:-1,e=dx+dy;
  for(;;){ this.px(x0,y0,typeof c==='function'?c(x0,y0):c); if(x0===x1&&y0===y1)break; var e2=2*e; if(e2>=dy){e+=dy;x0+=sx;} if(e2<=dx){e+=dx;y0+=sy;} } };
B.drect=function(x,y,w,h,c1,c2,level){ for(var j=y;j<y+h;j++) for(var i=x;i<x+w;i++) this.px(i,j,bayer(i,j)<level?c2:c1); };
B.fn=function(x,y,w,h,f){ for(var j=y;j<y+h;j++) for(var i=x;i<x+w;i++){ var c=f(i,j); if (c!==undefined) this.px(i,j,c); } };
B.poly=function(pts,c){
  var miny=1e9,maxy=-1e9,n=pts.length,i,j;
  for(i=0;i<n;i++){ miny=Math.min(miny,pts[i][1]); maxy=Math.max(maxy,pts[i][1]); }
  miny=Math.max(0,Math.floor(miny)); maxy=Math.min(this.h-1,Math.ceil(maxy));
  for (var y=miny;y<=maxy;y++){ var yc=y+0.5, xs=[];
    for(i=0,j=n-1;i<n;j=i++){ var a=pts[i],b=pts[j]; if((a[1]>yc)!==(b[1]>yc)) xs.push(a[0]+(yc-a[1])*(b[0]-a[0])/(b[1]-a[1])); }
    xs.sort(function(p,q){return p-q;});
    for (var k=0;k+1<xs.length;k+=2){ var xa=Math.ceil(xs[k]-0.5), xb=Math.floor(xs[k+1]-0.5);
      for (var x=xa;x<=xb;x++) this.px(x,y,typeof c==='function'?c(x,y):c); } } };
B.ellipse=function(cx,cy,rx,ry,c){ for(var y=Math.floor(cy-ry);y<=Math.ceil(cy+ry);y++) for(var x=Math.floor(cx-rx);x<=Math.ceil(cx+rx);x++){ var dx=(x+0.5-cx)/rx, dy=(y+0.5-cy)/ry; if(dx*dx+dy*dy<=1) this.px(x,y,typeof c==='function'?c(x,y):c); } };
B.map=function(x,y,w,h,lut,mask){ for(var j=Math.max(0,y);j<Math.min(this.h,y+h);j++) for(var i=Math.max(0,x);i<Math.min(this.w,x+w);i++){ if (mask && !mask(i,j)) continue; var k=j*this.w+i, c=this.d[k]; if(c!==T) this.d[k]=lut[c]; } };
B.blit=function(src,ox,oy,flip,lut){ ox|=0; oy|=0; for(var j=0;j<src.h;j++){ var y=oy+j; if (y<0||y>=this.h) continue; for(var i=0;i<src.w;i++){ var c=src.d[j*src.w+(flip?src.w-1-i:i)]; if(c===T) continue; var x=ox+i; if (x<0||x>=this.w) continue; this.d[y*this.w+x]=lut?lut[c]:c; } } };
B.clone=function(){ var b=new Buf(this.w,this.h); b.d.set(this.d); return b; };
B.copyFrom=function(src){ this.d.set(src.d); };
M.Buf=Buf;

// Stempel aus Textzeilen mit Legende ('.' und ' ' = transparent)
M.stamp=function(rows,legend){ var h=rows.length,w=0; rows.forEach(function(r){ w=Math.max(w,r.length); });
  var b=new Buf(w,h,T); for (var y=0;y<h;y++) for (var x=0;x<rows[y].length;x++){ var ch=rows[y][x]; if (ch==='.'||ch===' ') continue; var c=legend[ch]; if (c===undefined) throw new Error('Stempel-Legende ohne '+ch); b.d[y*w+x]=c; } return b; };
M.outline=function(b,col){ col=col===undefined?P.k1:col; var add=[];
  for (var y=0;y<b.h;y++) for (var x=0;x<b.w;x++){ if (b.get(x,y)!==T) continue;
    var n=[b.get(x-1,y),b.get(x+1,y),b.get(x,y-1),b.get(x,y+1)];
    for (var i=0;i<4;i++) if (n[i]!==T && n[i]!==col){ add.push(x,y); break; } }
  for (var k=0;k<add.length;k+=2) b.px(add[k],add[k+1],col); return b; };

var LIT=M.R('s3 s4 s5 s6'), SHD=M.R('m2 m3 s2 s3'), OPEN=M.R('m1 m2 m2 s2'), DEEP=M.R('k2 m0 m1 m2');
var COLS=[6,36,66,96,126,156], SPR=50, ARR=11;        // Säulengang: Säulenmitten, Kämpferlinie, Bogenradius
var CORN=28;                                           // Oberkante Gesims des Säulengangs
var TWR={x:198,w:26};                                  // Glockenturm (Mitte, Breite unten)
var PRO={x0:224,x1:336,top:88,cols:[236,259,301,324],apex:16,arc:[280,44,14]};   // Protiron mit Stufen
var KIO={x0:342,x1:364,base:106};                      // Zeitungskiosk
var ALY={x0:366,x1:404};                               // Gasse
var SHOP={x0:404,win:[411,66,28,34],door:[448,62,22,42],sign:[411,49,60,13]};
var SUN=[11,15];                                       // Lichtversatz: Sonne von links oben
var LINES=[[368,24,410,20],[372,42,408,38]];           // Wäscheleinen über der Gasse
var CLINE=[[70,58,92,58],[100,58,122,58]];             // Wäscheleinen zwischen den Säulen
function rnd(v){ return Math.round(v); }
function lime(x,y,sh,sw,hh){ return tex.ashlar(x,y,sh===2?OPEN:(sh?SHD:LIT),sw||17,hh||8); }
function shadePx(b,x,y,n){ var c=b.get(x,y); if (c!==T) b.px(x,y,M.step(c,-(n||2))); }

// ---------------------------------------------------------------- Himmel (Bura: tiefblau, klar, ein paar Federwolken)
function sky(b){ for (var y=0;y<GY;y++) for (var x=0;x<W;x++) b.px(x,y,M.rampAt(M.R('b0 b1 b2 b3 b4'),0.06+y/115,x,y));
  for (var i=0;i<6;i++){ var cx=20+i*83+hash(i,2)*30, cy=5+hash(i,3)*14, L=26+hash(i,4)*36; for (var k=0;k<L;k++){ var xx=rnd(cx+k), yy=rnd(cy+Math.sin(k*0.09+i)*1.5+k*0.04); var a=0.55-Math.abs(k/L-0.5); if (bayer(xx,yy)<a) b.px(xx,yy,P.b3); if (bayer(xx,yy)<a-0.3) b.px(xx,yy,P.b4); } } }

// ---------------------------------------------------------------- Pflaster: polierter Kalkstein in Perspektive
var HZ=36, VPX=240;
function paving(b){ for (var y=GY;y<144;y++){ var d=y-HZ, rz=1500/d, row=Math.floor(rz), fy=rz-row, off=(row%2)*0.5+hash(row,7)*0.3;
    for (var x=0;x<W;x++){ var X=(x-VPX)/d*3.4+off, col=Math.floor(X), fx=X-col, jw=d/3.4/ (d)*0.9/ (d/64);
      var t=hash(col,row), c=t<0.25?P.s4:(t<0.8?P.s5:(t<0.93?P.s6:P.s4));
      var edge=(fx<0.9/(d/3.4*0.29)*0.08) || fx<0.035;   // Fuge senkrecht
      if (edge) c=P.s3; if (fy<0.06+12/(d*d)*8) c=P.s3; if (fy<0.04) c=P.s2;
      // Glanz: polierte Stellen, ausgetretene Mitte
      var g=hash(x>>1,y); if (g<0.05) c=M.DN[c]; else if (g>0.985) c=P.l0;
      if (c===P.s5 && Math.sin(x*0.05+y*0.4+t*6)>0.93) c=P.s6;
      b.px(x,y,c); } } }

// ---------------------------------------------------------------- Kathedrale hinter dem Säulengang: achteckiger Tambour, Zeltdach
function cathedral(b){ var x, y;
  for (y=17;y<CORN;y++) for (x=26;x<150;x++){ var u=(x-26)/124, c=lime(x,y,u>0.7?1:0,12,5); if (Math.abs(u-0.7)<0.009) c=P.s2; b.px(x,y,c); }
  for (var k=0;k<7;k++){ var ax=31+k*17; for (y=19;y<27;y++) for (x=ax;x<ax+7;x++){ var dx=x-ax-3, top=y<22?(dx*dx>(y-19)*3.5):false; if (top) continue; b.px(x,y,(x<ax+2||y<21)?P.s2:(ax>113?P.m2:P.s3)); } }   // Blendarkaden
  b.hl(24,151,17,P.s6); b.hl(24,151,18,P.s3);
  for (y=8;y<17;y++){ var x0=40+(16-y)*5.2-(16-y)*0.3, x1=138-(16-y)*5.2; for (x=rnd(x0);x<rnd(x1);x++){ var u2=(x-x0)/Math.max(1,x1-x0), c2=((x+y*2)%4===0)?P.t1:(u2<0.55?P.t4:(u2<0.8?P.t3:P.t2)); if ((y%3)===0) c2=M.DN[c2]; b.px(x,y,c2); } }
  // niedrige Mauern der Kathedrale hinter dem Turm (offener Schatten)
  for (y=62;y<94;y++) for (x=160;x<226;x++) b.px(x,y,lime(x,y,2,13,6));
  b.hl(160,225,62,P.s5); b.hl(160,225,63,P.s3); }

// ---------------------------------------------------------------- Säulengang
function inOpening(x,y,i){ var a=COLS[i], z=COLS[i+1], xl=a+4, xr=z-4, cx=(a+z)/2; if (x<xl||x>=xr) return false; if (y>=SPR) return y<94; var dx=x-cx+0.5, dy=y-SPR; return dx*dx+dy*dy<ARR*ARR; }
function openingAt(x,y){ for (var i=0;i<COLS.length-1;i++) if (inOpening(x,y,i)) return i; return -1; }
function granite(x,y,cx,r){ var u=(x-cx)/r, v=0.66-u*0.55-(u>0.4?0.28:0); if (Math.abs(u+0.45)<0.14) v+=0.3;
  var c=M.rampAt(M.R('t1 t2 t3 t4'),v+(hash(x,y>>1)-0.5)*0.16,x,y); var h=hash(x*3+1,y*5+2); if (h<0.07) c=(u<0.2)?P.s4:P.t0; else if (h>0.955) c=P.t0; return c; }
function capital(b,cx,y0,sh){ // korinthisch, 9 px hoch, oben 13 px breit; y0 = Oberkante
  var L=sh?SHD:LIT; for (var j=0;j<9;j++){ var hw=4+Math.round(j*0.35)+(j<2?2:0); for (var x=cx-hw;x<=cx+hw-1;x++){ var u=(x-cx+hw)/(2*hw), c=u<0.35?L[3]:(u<0.7?L[2]:L[1]);
      if (j<2){ c=(j===0)?L[3]:L[1]; if (u>0.75) c=M.DN[c]; }
      else if (j<4){ if (x===cx-hw||x===cx+hw-1) c=L[0]; else if (x===cx-hw+1||x===cx+hw-2) c=L[3]; }
      else { var leaf=((x-cx+20)%3); c=leaf===0?L[1]:(leaf===1?L[3]:L[2]); if (j===4&&leaf!==1) c=L[0]; if (j>=7) c=(leaf===1)?L[2]:L[1]; if (u>0.72) c=M.DN[c]; }
      b.px(x,y0+8-j,c); } } }
function colBase(b,cx,y0){ b.rect(cx-6,y0,12,3,P.s5); b.hl(cx-6,cx+5,y0,P.s6); b.hl(cx-6,cx+5,y0+2,P.s3); b.vl(cx+5,y0,y0+2,P.s3);
  b.hl(cx-5,cx+4,y0-1,P.s5); b.px(cx+4,y0-1,P.s3); b.hl(cx-4,cx+3,y0-2,P.s2); b.hl(cx-5,cx+4,y0-3,P.s6); b.px(cx+4,y0-3,P.s4); }
function colonnade(b){ var x, y, i;
  for (y=CORN;y<94;y++) for (x=0;x<166;x++) b.px(x,y,lime(x,y,0,15,7));
  // Öffnungen: Gang im Schatten, Sonnenflecken durch die Bögen auf Rückwand und Boden
  for (y=SPR-ARR;y<94;y++) for (x=0;x<166;x++){ var o=openingAt(x,y); if (o<0) continue;
    var lit=openingAt(x-SUN[0],y-SUN[1])===o, c;
    if (y>=87) c=lit?(y===87?P.s4:P.s5):(y===87?P.m1:P.m2);
    else c=tex.ashlar(x*1.15,y,lit?M.R('s2 s4 s4 s5'):OPEN,12,6);
    if (!lit && y<SPR-2) c=M.DN[c];
    b.px(x,y,c); }
  [[47,66,7,21],[107,64,8,23]].forEach(function(d){ b.rect(d[0],d[1],d[2],d[3],P.k1); b.ellipse(d[0]+d[2]/2,d[1],d[2]/2,3,P.k1); b.vl(d[0]+d[2],d[1],d[1]+d[3]-1,P.m3); });   // Türen hinten
  // Bogenringe aus Keilsteinen
  for (i=0;i<COLS.length-1;i++){ var cx=(COLS[i]+COLS[i+1])/2;
    for (y=SPR-ARR-5;y<=SPR;y++) for (x=rnd(cx-ARR-5);x<=rnd(cx+ARR+5);x++){ var dx=x-cx+0.5, dy=y-SPR, rr=Math.sqrt(dx*dx+dy*dy); if (rr<ARR||rr>ARR+4.4||dy>0) continue;
      var ang=Math.atan2(-dy,dx), q=ang/(Math.PI/9), c2=(Math.abs(q-Math.round(q))<0.1)?P.s3:((Math.floor(q)%2)?P.s5:P.s6); if (rr>ARR+3.5) c2=P.s4; if (rr<ARR+1) c2=(dx>0)?P.s4:P.s2; b.px(x,y,c2); } }
  // Säulen
  COLS.forEach(function(cx){ for (y=SPR+9;y<91;y++) for (x=cx-4;x<cx+4;x++) b.px(x,y,granite(x,y,cx-0.5,4));
    b.hl(cx-4,cx+3,SPR+9,P.s5); b.hl(cx-4,cx+3,90,P.s4); capital(b,cx,SPR,false); colBase(b,cx,91); });
  // Gesims mit Zahnschnitt, Schatten darunter
  b.rect(0,CORN,166,6,P.s5); b.hl(0,165,CORN,P.s6); b.hl(0,165,CORN+1,P.s6); b.hl(0,165,CORN+3,P.s3); for (x=0;x<166;x+=3){ b.px(x,CORN+4,P.s2); b.px(x+1,CORN+4,P.s5); } b.hl(0,165,CORN+5,P.s4);
  for (x=0;x<166;x++) for (y=CORN+6;y<CORN+9;y++) if (bayer(x,y)<(CORN+9-y)/3.4) shadePx(b,x,y,2);
  // Stylobat: zwei Stufen, Schlagschatten der Säulen nach rechts
  for (y=94;y<GY;y++) for (x=0;x<PRO.x0;x++){ var st=y<97?0:1, c3=(y===94||y===97)?P.s6:(st?P.s4:P.s5); if (hash(x>>3,y)<0.1) c3=M.DN[c3]; if (((x+st*7)%23)===0) c3=P.s3; b.px(x,y,c3); }
  COLS.forEach(function(cx){ for (y=94;y<GY;y++){ var sx=cx+4+(y-94)*0.7; for (x=rnd(sx);x<rnd(sx+6);x++) shadePx(b,x,y,2); } });
  CLINE.forEach(function(l){ for (x=l[0];x<=l[2];x++) b.px(x,l[1]+Math.round(Math.sin((x-l[0])/(l[2]-l[0])*Math.PI)*2),P.k2); }); }

// ---------------------------------------------------------------- Glockenturm von Sv. Duje: romanisch, nach oben immer offener
function bell(b,cx,y){ b.hl(cx-1,cx+1,y,P.y1); b.rect(cx-2,y+1,5,2,P.y2); b.hl(cx-3,cx+3,y+3,P.y1); b.px(cx-1,y+1,P.y4); b.px(cx,y+4,P.y0); }
function arched(b,x0,y0,w,h,inner){ // dunkle Bogenöffnung, Schatten oben links
  for (var y=y0;y<y0+h;y++) for (var x=x0;x<x0+w;x++){ if (y===y0 && (x===x0||x===x0+w-1) && w>2) continue; var c=(x===x0||y<y0+2)?P.k1:(inner||P.n0); b.px(x,y,c); } }
function tower(b){ var cx=TWR.x, x, y;
  // Schlagschatten des Turms auf die Mauer rechts
  for (y=62;y<94;y++) for (x=cx+13;x<cx+24-(y-62)*0.1;x++) shadePx(b,x,y,1);
  var st=[[68,96,26,0],[55,68,26,1],[43,55,24,2],[31,43,22,3],[19,31,20,4]];   // [oben, unten, Breite, Typ]
  st.forEach(function(s){ var y0=s[0], y1=s[1], w=s[2], xl=cx-(w>>1), xr=xl+w-1, side=Math.max(3,w>>2);
    for (y=y0;y<y1;y++) for (x=xl;x<=xr;x++){ var c=tex.ashlar((x-xl)*1.25+s[3]*7,y,x>xr-side?SHD:LIT,9,5); if (x===xl) c=P.s6; if (x===xr-side+1) c=P.s3; if (x===xr) c=P.m2; b.px(x,y,c); }
    b.hl(xl-1,xr+1,y0,P.s6); b.hl(xl-1,xr-side,y0+1,P.s4); b.hl(xr-side+1,xr+1,y0+1,P.m2); b.px(xr+1,y0,P.s3);
    for (x=xl;x<=xr;x++){ shadePx(b,x,y0+2,1); if (bayer(x,y0+3)<0.4) shadePx(b,x,y0+3,1); }
    var oy=y0+4, fx=xl+2, fw=w-side-4, mid=fx+(fw>>1);
    if (s[3]===0){ arched(b,mid-4,78,8,18,P.k2); b.vl(mid-5,77,95,P.s6); b.vl(mid+4,77,95,P.s3); b.hl(mid-5,mid+4,76,P.s6); arched(b,xl+3,72,2,5); arched(b,xr-side-3,72,2,5); }
    else if (s[3]===1||s[3]===2){ var oh=s[3]===1?8:9; [mid-8,mid+1].forEach(function(bx){ arched(b,bx,oy,3,oh); arched(b,bx+4,oy,3,oh); b.vl(bx+3,oy+1,oy+oh-1,P.s5); b.px(bx+3,oy,P.s6); b.hl(bx-1,bx+7,oy+oh,P.s6); }); }
    else if (s[3]===3){ for (var k=0;k<3;k++){ arched(b,mid-8+k*5,oy-1,3,9); if (k<2) b.vl(mid-5+k*5,oy,oy+7,P.s5); } b.hl(mid-9,mid+7,oy+8,P.s6); }
    else { for (var k2=0;k2<2;k2++){ var ox=mid-7+k2*7; arched(b,ox,oy-2,6,9,P.k2); bell(b,ox+3,oy); b.vl(ox+6,oy-1,oy+6,P.s5); } b.hl(mid-8,mid+6,oy+7,P.s6); } });
  // Eckfialen, steinerne Pyramide mit Kreuz
  [cx-10,cx+8].forEach(function(px){ b.rect(px,14,2,5,P.s5); b.px(px,13,P.s6); b.px(px+1,14,P.s3); });
  for (y=2;y<19;y++){ var hw=Math.max(1,Math.round((y-2)*0.56)); for (x=cx-hw;x<=cx+hw;x++){ var c5=(x<cx)?(x<=cx-hw?P.s6:P.s5):(x<cx+hw-1?P.s3:P.m2); if (((y*3+x)%6)===0) c5=M.DN[c5]; b.px(x,y,c5); } }
  b.hl(cx-10,cx+9,19,P.s6); b.vl(cx,0,2,P.k2); b.hl(cx-1,cx+1,0,P.k2); }

// ---------------------------------------------------------------- Sphinx aus schwarzem Granit auf einem Sockel (Blick nach rechts)
var SPH=[                     // ohne Kopf: nur der Halsstumpf mit Bruchkante und die Ansätze des Nemes-Tuchs
"............sHs.......",
"...........hmmmhd.....",
"...........lmmmmmd....",
"..........dlmmmmmd....",
"..hhhhhhhhhlmmmmmd....",
".hllllllllllmmmmmd....",
"hllmmmmmmmmmmmmmmdhhhh",
"lmmmmmmmmmmmmmmmmmmmmd",
"dmmmmmmmmmmmmmmmmmmmmd"];
function sphinx(b,x,by){ var xx, yy;
  for (yy=by-11;yy<by;yy++) for (xx=x+24;xx<x+31;xx++) if (xx<x+24+((by-yy)*0.6)) shadePx(b,xx,yy,2);   // Schlagschatten des Sockels
  for (yy=by-11;yy<by;yy++) for (xx=x;xx<x+24;xx++){ var c=(yy===by-11)?P.s6:((xx>x+20)?P.s3:P.s5); if (yy===by-10) c=P.s4; if (yy===by-8) c=P.s3; if (yy===by-1) c=P.s3; if (hash(xx>>2,yy)<0.08) c=M.DN[c]; b.px(xx,yy,c); }
  var st=M.outline(M.stamp(SPH,{h:P.m2,H:P.m3,l:P.m1,m:P.m0,d:P.k2,s:P.m1}),P.k1); b.blit(st,x+1,by-11-SPH.length);
  for (xx=x+2;xx<x+23;xx++) shadePx(b,xx,by-10,1); }

// ---------------------------------------------------------------- Protiron und Stufen zum Vestibül
function protiron(b){ var x, y, i, x0=PRO.x0, x1=PRO.x1, cx=PRO.arc[0], ar=PRO.arc;
  // Rückwand des Vestibüls im Schatten, großes Tor, drinnen ein Lichtschacht aus der Kuppel
  for (y=ar[1]-ar[2]-1;y<PRO.top;y++) for (x=x0+4;x<x1-4;x++){ if (y<36){ var qx=x-cx+0.5, qy=y-ar[1]; if (qx*qx+qy*qy>=ar[2]*ar[2]) continue; } b.px(x,y,lime(x,y,2,13,6)); }
  for (y=52;y<PRO.top;y++) for (x=cx-12;x<cx+13;x++){ if (y<60){ var dx=x-cx+0.5, dy=y-60; if (dx*dx+dy*dy>12.5*12.5) continue; } var c=P.k1; var sh=Math.abs(x-cx-2+(y-52)*0.25); if (sh<2.5+(y-52)*0.12) c=(sh<1.2)?P.m1:P.k2; if (y>=PRO.top-3 && Math.abs(x-cx)<6) c=P.m0; b.px(x,y,c); }
  b.vl(cx-13,50,PRO.top-1,P.m3); b.vl(cx+13,50,PRO.top-1,P.s3);
  // Säulen auf Postamenten
  PRO.cols.forEach(function(c){ for (y=76;y<PRO.top;y++) for (x=c-6;x<c+6;x++){ var u=(x-c+6)/11, cc=lime(x,y,u>0.72?1:0,6,4); if (y===76) cc=P.s6; if (y===77) cc=P.s4; b.px(x,y,cc); }
    for (y=51;y<76;y++) for (x=c-4;x<c+4;x++) b.px(x,y,granite(x,y,c-0.5,4));
    b.hl(c-4,c+3,75,P.s4); capital(b,c,42,false); colBase(b,c,73); });
  // Gebälk (Architrav, Fries, Gesims) über den äußeren Säulen
  for (y=36;y<42;y++) for (x=x0+4;x<x1-4;x++){ var cc2=(y===36)?P.s6:((y===39)?P.s3:P.s5); if (x>x1-12) cc2=M.DN[cc2]; var dax=x-cx+0.5, day=y-ar[1]; if (Math.sqrt(dax*dax+day*day)<ar[2]+4) continue; b.px(x,y,cc2); }
  for (x=x0+4;x<x1-4;x++) for (y=42;y<45;y++){ if (PRO.cols.some(function(c){ return Math.abs(x-c+0.5)<6; })) continue; var dd=x-cx+0.5; if (Math.abs(dd)<ar[2]) continue; if (bayer(x,y)<(45-y)/3.4) shadePx(b,x,y,2); }
  // Bogen in der Mitte (syrischer Giebel)
  for (y=ar[1]-ar[2]-5;y<=ar[1];y++) for (x=cx-ar[2]-5;x<=cx+ar[2]+5;x++){ var dx2=x-cx+0.5, dy2=y-ar[1], r=Math.sqrt(dx2*dx2+dy2*dy2); if (r<ar[2]||r>=ar[2]+4.5) continue;
    var q=Math.atan2(-dy2,dx2)/(Math.PI/10); b.px(x,y,(r<ar[2]+1)?(dx2>0?P.s4:P.s2):((Math.abs(q-Math.round(q))<0.1)?P.s3:((Math.floor(q)%2)?P.s5:P.s6))); }
  // Giebel: Gesims hell, Tympanon mit Schatten unter dem Schräggesims
  for (y=PRO.apex;y<37;y++){ var t=(y-PRO.apex)/(37-PRO.apex), hw=t*(x1-x0)/2; for (x=rnd(cx-hw);x<=rnd(cx+hw);x++){ var dxa=Math.abs(x-cx), edge=hw-dxa, c3;
      if (edge<2.4) c3=(x<cx)?P.s6:P.s4; else { c3=lime(x,y,0,10,5); if (edge<4.8) c3=M.DN[M.DN[c3]]; }
      var ddx=x-cx+0.5, ddy=y-ar[1]; if (Math.sqrt(ddx*ddx+ddy*ddy)<ar[2]+4.5) continue; b.px(x,y,c3); } }
  b.hl(x0+3,x1-4,37,P.s6); b.hl(x0+3,x1-4,38,P.s3);
  // Stufen hinab aufs Pflaster
  for (i=0;i<5;i++){ var sy1=GY+6-i*3.6, sy0=sy1-3.6, sx0=x0+8, sx1=x1-8;
    for (y=rnd(sy0);y<rnd(sy1);y++) for (x=sx0;x<sx1;x++){ var c4=(y===rnd(sy0))?P.s6:((y===rnd(sy0)+1)?P.s5:P.s4); if (y===rnd(sy1)-1) c4=P.s3; if (hash(x>>2,y)<0.07) c4=M.DN[c4]; b.px(x,y,c4); } }
  // Wangenmauern; die linke wirft einen Schatten schräg über die Stufen
  [[x0,x0+8],[x1-8,x1]].forEach(function(s,k){ for (y=76;y<GY+6;y++) for (x=s[0];x<s[1];x++){ var cc5=lime(x,y,(k===1&&x>s[1]-3)?1:0,8,5); if (y===76) cc5=P.s6; if (y===77) cc5=P.s4; b.px(x,y,cc5); } });
  for (y=PRO.top-2;y<GY+6;y++){ var se=x0+8+5+(y-PRO.top)*0.45; for (x=x0+8;x<se;x++) shadePx(b,x,y,2); }

  var v=0.6-by*0.75-bx*0.25-b1*0.3; if (b2-b1<0.1) v-=0.32; return v; }

async function wakeLjerka(A){ await A.anim('knock'); A.sfx('knock'); await A.wait(1400); A.sfx('door');

  await L.say('Gospodine Vuković. Es ist zwei Uhr nachts.'); await A.m('Ich habe etwas gefunden, das Ihnen gehört.');
  var done={};
  for (var guard=0;guard<12 && !(done.env&&done.letter&&done.msg);guard++){
    var c=await A.choose([{t:'(Den Umschlag aus Zagreb geben.)',id:'env',silent:true},{t:'(Brunos Brief geben.)',id:'letter',silent:true},{t:'(Ihr Brunos Satz sagen.)',id:'msg',silent:true}].filter(function(o){ return !done[o.id]; }),{title:'Ljerka'});
    if (c==='env'){ done.env=1; await A.animM('give'); A.take('envelope'); A.sfx('paper'); await M.readEnvelope(A,true);
      await L.say('Ich bin angenommen worden?'); await A.wait(1000); await L.say('Ich dachte … sie hätten mich nicht gewollt. Ich habe nie nachgefragt. Ich war zwanzig, und meine Mutter war gerade gestorben.');
      await L.say('Woher haben Sie das?'); await A.m('Aus dem Klavierhocker im Salon.'); await A.wait(1300); await L.say('Sechsunddreißig Jahre.'); }
    else if (c==='letter'){ done.letter=1; await A.animM('give'); A.take('brunoletter'); A.sfx('paper'); await L.say('Seine Schrift.'); await L.say('„Ljerka, ja sam …“ Ich was?'); await L.say('Er hat nie einen Satz zu Ende gebracht. Nicht mit mir.'); }
    else { if (!done.env){ await A.m('Erst muss sie sehen, worum es geht.'); continue; } done.msg=1; await A.m('Ihr Vater wollte Ihnen etwas sagen. Am Ende konnte er es nicht mehr. Ich glaube, es war das hier:');
      await A.m('„Ljerka, verzeih mir. Ich habe deinen Brief aus Zagreb versteckt, weil ich Angst hatte, allein zu sein. Spiel wieder.“');
      await L.say('Woher wollen Sie wissen, was er sagen wollte?');
      var c2=await A.choose([{t:'Ich bin Übersetzer. Ich habe gelesen, was da steht. Und was nicht.',id:'tr'},{t:'Er hat es mir gesagt.',id:'he'}],{title:'Ljerka'});
      if (c2==='he'){ await L.say('…'); await A.wait(1500); await L.say('Sie sind ein seltsamer Mensch, Gospodine Vuković.'); } else { await L.say('Was nicht dasteht.'); await A.wait(1300); }
      await L.say('Er hat es gewusst. Die ganzen Jahre. Jeden Morgen, wenn ich den Frühstücksraum aufgeschlossen habe.'); } }
  await A.wait(1500); await L.say('Kommen Sie.'); A.setFlag('c3.ljerkaUp');
  await A.goto('salon',{noEnter:true}); return salonFinale(A); }

async function finale(A){ var I=A.npc('ivka'); A.music('ghost'); A.S.ferryAt=A.gt; A.sfx('horn'); await A.wait(700);

      await I.say('Mit Matićs kleinem Boot? Bei der Bura?'); await I.say('Dieser Dickkopf. Dieser …'); await A.wait(800); await I.say('Und Dinko?'); await A.m('Dinko hat es geschafft.'); await A.wait(1100); await I.say('…und Tonći nicht.'); break; }
    await roundMiss(A,I,n,tries,['Was hat das mit meinem Sohn zu tun?','Ich verstehe nicht, was Sie meinen.','Sagen Sie, was Sie sagen wollen.'],'Sie muss wissen, warum er nicht auf dem Schiff war. Wie er kommen wollte.'); }
  // Runde 3: die Handschuhe
  await I.say('Dann ist er da draußen. Dann warte ich, bis das Meer ihn bringt. Das Meer bringt alles zurück.');
  for (tries=0;;tries++){ var c=await A.choose([{t:'(Ihr die grauen Handschuhe geben.)',id:'gloves',silent:true},{t:'„Das Meer bringt ihn nicht zurück.“',id:'hard',silent:true},{t:'„Sie müssen nicht mehr warten.“',id:'soft',silent:true}],{title:'Ivka'});

      await I.say('Handschuhe.'); await A.wait(700); await I.say('Grau. Er wusste, dass ich nie welche trage.'); await I.say('Dieser Junge. Für das Geld hätte er sich Schuhe kaufen können.'); break; }
    if (c==='hard'){ await I.say('Das Meer behält nichts. Das Meer bringt alles zurück. Irgendwann. Ich habe Zeit.'); }
    else { await I.say('Ich warte gern. Wer wartet, hat noch etwas vor sich.'); }
    if (tries>=1 && A.malaHere()) await A.g('Er hat ihr etwas mitgebracht. Gib es ihr.'); }
  // Runde 4: der Brief
  await I.say('Aber warum Handschuhe? Er hätte mir Schokolade bringen können. Oder Feigen.');
  for (tries=0;;tries++){ c=await A.choose([{t:'(Seinen Brief vorlesen.)',id:'letter',silent:true},{t:'„Damit Sie nicht mehr frieren.“',id:'warm',silent:true},{t:'„Er ist tot, Gospođa Perić.“',id:'dead',silent:true}],{title:'Ivka'});
    if (c==='letter'){ await A.anim('read'); await A.m('Er hat Ihnen geschrieben. „Liebe Mama. Das ist das letzte Mal, dass du in der Kälte auf mich wartest. Ich habe dir Handschuhe gekauft, für die kalten Abende auf der Riva.“');

    if (c==='warm'){ await I.say('Ich friere nicht. Ich habe nie gefroren. Das sagt jeder, und ich friere nie.'); }
    else { await I.say('…'); await I.face('R'); await I.say('Ich warte trotzdem. Ein Brief von ihm, der sagt, ich soll aufhören. Dann höre ich auf. Sonst nicht.'); }
    if (tries>=1 && A.malaHere()) await A.g('Er hat ihr geschrieben, was sie tun soll. Lies es ihr vor.'); }

  var st=M.apos('riva','ivka'); I.set('speed',120); I.set('step',3); var walk=I.walk(st[0]-260,st[1]+4); await A.wait(2600); A.sfx('bellBig'); await A.wait(400);

(function(M){
'use strict';
if (typeof document==='undefined') return;
var cv=document.getElementById('game'), ctx=cv.getContext('2d',{alpha:false}), img=ctx.createImageData(320,200);
var u32=new Uint32Array(img.data.buffer), PAL=new Uint32Array(256);
for (var i=0;i<256;i++){ var q=M.RGB[i]||M.RGB[0]; PAL[i]=(255<<24)|(q[2]<<16)|(q[1]<<8)|q[0]; }
ctx.imageSmoothingEnabled=false;
var hint=document.getElementById('hint');
// Röhrenbild (Menüpunkt): Scanlines + Vignette
var crtEl=document.createElement('div'); crtEl.id='crt'; document.body.appendChild(crtEl);
var st=document.createElement('style'); st.textContent='#crt{position:fixed;pointer-events:none;display:none;z-index:5}#crt.on{display:block;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.5) 100%),repeating-linear-gradient(to bottom,rgba(0,0,0,.3) 0,rgba(0,0,0,.3) var(--a),rgba(0,0,0,0) var(--a),rgba(0,0,0,0) var(--b));border-radius:16px}#game.crt{filter:saturate(1.15) contrast(1.06) brightness(1.1);border-radius:16px}';
document.head.appendChild(st);
var crt=false; try{ crt=localStorage.getItem('mala.crt')==='1'; }catch(e){}
function placeCRT(){ var r=cv.getBoundingClientRect(); crtEl.style.left=r.left+'px'; crtEl.style.top=r.top+'px'; crtEl.style.width=r.width+'px'; crtEl.style.height=r.height+'px'; var row=r.height/200; crtEl.style.setProperty('--a',(row*0.45)+'px'); crtEl.style.setProperty('--b',row+'px'); }
M.crtOn=function(){ return crt; };
M.setCRT=function(on){ crt=on; try{ localStorage.setItem('mala.crt',on?'1':'0'); }catch(e){} crtEl.className=on?'on':''; cv.className=on?'crt':''; placeCRT(); };
M.fullscreen=function(){ var d=document.documentElement; try{ (d.requestFullscreen||d.webkitRequestFullscreen||function(){}).call(d); }catch(e){} };
function fit(){ var dpr=window.devicePixelRatio||1, vw=window.innerWidth, vh=window.innerHeight; var s=Math.floor(Math.min(vw*dpr/320,vh*dpr/200)), css;
  if (s>=1) css=320*s/dpr; else css=vw; if (css*200/320>vh) css=vh*320/200; if (css>vw) css=vw;
  cv.style.width=css+'px'; cv.style.height=(css*200/320)+'px'; if (hint) hint.style.display=(vh>vw*1.1)?'block':'none'; setTimeout(placeCRT,0); }
window.addEventListener('resize',fit); window.addEventListener('orientationchange',function(){ setTimeout(fit,250); }); fit();
function toLogical(e){ var r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*320,(e.clientY-r.top)/r.height*200]; }
cv.addEventListener('pointerdown',function(e){ e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} var p=toLogical(e); M.pointerDown(p[0],p[1],e.pointerType!=='mouse'); });
cv.addEventListener('pointermove',function(e){ var p=toLogical(e); M.pointerMove(p[0],p[1],e.pointerType!=='mouse'); });
cv.addEventListener('pointerup',function(e){ e.preventDefault(); var p=toLogical(e); M.pointerUp(p[0],p[1],e.pointerType!=='mouse'); });
cv.addEventListener('contextmenu',function(e){ e.preventDefault(); });
document.addEventListener('keydown',function(e){ if (e.key===' '||e.key==='Tab') e.preventDefault(); M.key(e.key); });
document.addEventListener('touchmove',function(e){ if (e.target===cv) e.preventDefault(); },{passive:false});
document.addEventListener('touchend',function(){ try{ M.audioInit(); }catch(_){} },{passive:true});
document.addEventListener('gesturestart',function(e){ e.preventDefault(); });
document.addEventListener('visibilitychange',function(){ if (document.hidden){ try{ M.saveGame(); }catch(e){} } });
window.addEventListener('pagehide',function(){ try{ M.saveGame(); }catch(e){} });
var last=performance.now();
function frame(now){ var dt=now-last; last=now;
  try{ M.update(dt); var fb=M.renderFrame(), d=fb.d; for (var i=0;i<64000;i++) u32[i]=PAL[d[i]]; ctx.putImageData(img,0,0); }catch(err){ console.error(err); }
  requestAnimationFrame(frame); }
if (M.boot) M.boot();
M.setCRT(crt);
M.music('title');
requestAnimationFrame(frame);
})(M);

<script>
(function(){
  if (!('serviceWorker' in navigator) || location.protocol==='file:') return;
  var note=document.getElementById('offline-note');
  function show(t,ms){ note.textContent=t; note.style.display='block'; note.style.opacity='1'; if(ms) setTimeout(function(){ note.style.opacity='0'; setTimeout(function(){ note.style.display='none'; },700); },ms); }
  var shown=false;
  navigator.serviceWorker.addEventListener('message',function(e){ if(e.data==='offline-ready' && !shown){ shown=true; show('Offline bereit \u2713',4000); } });
  window.addEventListener('load',function(){
    var first=!navigator.serviceWorker.controller; if(first) show('Wird f\u00fcr offline gespeichert \u2026');
    navigator.serviceWorker.register('sw.js').then(function(){ return navigator.serviceWorker.ready; }).then(function(reg){ if(reg.active) reg.active.postMessage('check'); }).catch(function(err){ console.warn('SW',err); if(first) note.style.display='none'; });
  });
})();
